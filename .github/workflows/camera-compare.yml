name: camera-compare-artifacts
on:
  pull_request:
permissions:
  contents: read
jobs:
  camera-compare:
    if: startsWith(github.head_ref, 'research/camera-integrated')
    strategy:
      fail-fast: false
      matrix:
        mode: [0, 1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify existing host tests
        run: |
          bash tools/test_runtime.sh
          python3 tools/test_prepare_camera_compare_package.py
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build selected ESP32-S3 mode
        env:
          MODE: ${{ matrix.mode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          cat >> platformio.ini <<'EOF'

          [env:camera_compare]
          extends = env:atoms3cam
          build_flags =
            ${env:atoms3cam.build_flags}
          EOF
          printf '  -DFOOT_FAST_CAPTURE_EXPERIMENT=%s\n' "$MODE" >> platformio.ini
          printf '%s\n' '  -DCAMERA_DIAGNOSTIC_ONLY=1' >> platformio.ini
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          for i in 0 1 2 3 4; do
            printf '  -DCAMERA_BUILD_SHA_%s=0x%sUL\n' "$i" "${HEAD_SHA:$((i*8)):8}" >> platformio.ini
          done
          pio pkg install -e camera_compare
          python3 tools/verify_madgwick_dependency.py --library '.pio/libdeps/camera_compare/Adafruit AHRS'
          pio run -e camera_compare
          python3 tools/verify_madgwick_dependency.py --library '.pio/libdeps/camera_compare/Adafruit AHRS'
          ELF=.pio/build/camera_compare/firmware.elf
          OBJDUMP="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-objdump"
          NM="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm"
          python3 tools/verify_camera_task_link.py "$ELF" --objdump "$OBJDUMP"
          python3 tools/verify_log_encoder_link.py "$ELF" --nm "$NM"
          python3 tools/verify_realtime_code_link.py "$ELF" --objdump "$OBJDUMP"
          python3 tools/verify_imu_transport_link.py "$ELF" --nm "$NM"
          python3 tools/verify_core_isolation_link.py "$ELF" --objdump "$OBJDUMP"
          python3 tools/verify_motion_acquisition_link.py "$ELF" --objdump "$OBJDUMP"
          "$NM" "$ELF" | grep -q '__wrap_xTaskCreatePinnedToCore'
          for sym in cam_start cam_stop cam_take; do "$NM" "$ELF" | grep -q " $sym$"; done
          test -s madgwick-build-patch.json
          test -s bmi270-build-patch.json
      - name: Package identified Web Serial flasher
        env:
          MODE: ${{ matrix.mode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          mkdir -p camera-artifact/firmware
          cp .pio/build/camera_compare/{bootloader.bin,partitions.bin,firmware.bin} camera-artifact/firmware/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" camera-artifact/firmware/
          cp bmi270-build-patch.json madgwick-build-patch.json camera-artifact/
          python3 tools/prepare_camera_compare_package.py --mode "$MODE" --commit "$HEAD_SHA" --checkout-commit "$GITHUB_SHA" --output camera-artifact
          git checkout -- platformio.ini
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: camera-compare-mode-${{ matrix.mode }}-${{ github.event.pull_request.head.sha }}
          path: camera-artifact/
          if-no-files-found: error
          retention-days: 30
